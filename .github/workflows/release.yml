name: Release installer

on:
  push:
    # GitHub tag filters are globs; validate the exact syntax below.
    tags: ['*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          numeric_version='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          [[ $RELEASE_TAG =~ ^${numeric_version}$ ]] || {
            echo 'Release tags must be exactly X.Y.Z (no v prefix or leading zeros).' >&2
            exit 1
          }
          # Read the constant as data, never source or evaluate application code.
          mapfile -t definitions < <(grep -E '(^|[^[:alnum:]_])VERSION[[:space:]]*=' bin/codex-sync)
          [[ ${#definitions[@]} == 1 ]] || {
            echo 'Expected exactly one unambiguous VERSION definition.' >&2
            exit 1
          }
          [[ ${definitions[0]} =~ ^readonly\ VERSION=(${numeric_version})$ ]] || {
            echo 'Expected a literal numeric readonly VERSION constant.' >&2
            exit 1
          }
          [[ ${BASH_REMATCH[1]} == "$RELEASE_TAG" ]] || {
            echo 'Release tag does not match bin/codex-sync VERSION.' >&2
            exit 1
          }

      - name: Fetch Makeself 2.5.0
        uses: actions/checkout@v4
        with:
          repository: megastep/makeself
          ref: release-2.5.0
          path: .release-tools/makeself
          persist-credentials: false

      - name: Build and validate installer
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          mkdir -p "$work/payload/bin" "$work/home" "$work/config" "$work/tmp" dist
          # Explicit allowlist: never package the working tree or CI tooling.
          install -m 755 install.sh uninstall.sh "$work/payload/"
          install -m 755 bin/codex-sync bin/cpush bin/cpull "$work/payload/bin/"
          archive="$PWD/dist/codex-sync-$RELEASE_TAG.run"
          bash .release-tools/makeself/makeself.sh \
            --header .release-tools/makeself/makeself-header.sh \
            --gzip "$work/payload" "$archive" "codex-sync $RELEASE_TAG" ./install.sh
          chmod 755 "$archive"
          export HOME="$work/home" XDG_CONFIG_HOME="$work/config" TMPDIR="$work/tmp"
          bash "$archive" --check
          bash "$archive" --noexec --target "$work/extracted"
          diff -r "$work/payload" "$work/extracted"
          # Exercise the archive's actual startup command in an empty HOME.
          bash "$archive" --nox11
          for name in codex-sync cpush cpull; do
            cmp "bin/$name" "$HOME/.local/bin/$name"
            test -x "$HOME/.local/bin/$name"
          done
          [[ $("$HOME/.local/bin/codex-sync" --version) == "codex-sync $RELEASE_TAG" ]]
          [[ $("$HOME/.local/bin/cpush" --version) == "codex-sync $RELEASE_TAG" ]]
          [[ $("$HOME/.local/bin/cpull" --version) == "codex-sync $RELEASE_TAG" ]]
          bash "$work/extracted/uninstall.sh"
          for name in codex-sync cpush cpull; do
            test ! -e "$HOME/.local/bin/$name"
          done

      # Default success gating keeps validation/build failures away from Releases.
      - name: Publish installer
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: dist/codex-sync-${{ github.ref_name }}.run